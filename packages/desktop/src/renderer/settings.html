<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <!-- The settings panel loads nothing from anywhere: its only images are the
         icon masks the Iconify plugin inlines as `data:` URLs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>

  <body data-panel>
    <div id="settings"></div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
