appId: com.aidanmacmillan.fluid
afterPack: scripts/prepare-terminal.mjs
directories:
  buildResources: build
files:
  - '!dist/**/*'
  - '!out-test/**/*'
  - '!test/**/*'
  # Also exclude binaries left over from an earlier dependency installation.
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: ../../LICENSE.md
    to: LICENSE.md
asarUnpack:
  # node-pty ships a native addon and, on macOS, a `spawn-helper` binary it
  # execs — neither of which can be loaded or run from inside an asar archive.
  - resources/**
  - node_modules/node-pty/**
  - node_modules/@fluid/haptics/**
win:
  executableName: fluid
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # What makes the app a candidate for System Settings > Desktop & Dock >
    # Default web browser: macOS lists an app there only if it declares the
    # http and https schemes. Links opened from other apps then arrive as
    # `open-url` events (see src/main/external-links.ts).
    CFBundleURLTypes:
      - CFBundleURLName: Web site URL
        CFBundleURLSchemes:
          - http
          - https
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  # Lists the app in the desktop's default-browser choices. The generated
  # launcher already passes the address (`%U`), which the main process reads out
  # of argv.
  mimeTypes:
    - x-scheme-handler/http
    - x-scheme-handler/https
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: AidanMacMillan
  repo: fluid
  releaseType: draft
